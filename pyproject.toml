[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "forge-physical-data-compiler"
version = "0.1.0"
description = "FORGE-owned compiler from physical behavior observations to validated robot-ready datasets."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Proprietary"}
authors = [{name = "FORGE"}]
dependencies = ["httpx>=0.28,<1"]

[project.optional-dependencies]
cloud = ["boto3>=1.35,<2"]
gpu = ["runpod>=1.7,<2"]
data = ["pyarrow>=18,<21"]
dev = ["pytest>=8,<9", "ruff==0.15.21", "mypy>=1.14,<2"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src", "."]
