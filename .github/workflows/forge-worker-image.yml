name: Publish FORGE worker image

on:
  workflow_dispatch:
  push:
    branches:
      - agent/forge-handoffs
    paths:
      - .github/workflows/forge-worker-image.yml
      - infra/runpod/Dockerfile
      - pyproject.toml
      - src/**
      - workers/**

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish immutable worker image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/runpod/Dockerfile
          push: true
          build-args: |
            FORGE_REVISION=${{ github.sha }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/forge-worker:sha-${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/forge-worker:production
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Record immutable digest
        run: echo "FORGE_GPU_IMAGE=ghcr.io/${{ github.repository_owner }}/forge-worker@${{ steps.build.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"
