services:
  - type: web
    name: forge-web
    runtime: node
    region: oregon
    plan: free
    branch: agent/forge-handoffs
    buildCommand: NODE_ENV=development pnpm install && pnpm --filter @forge/web build
    startCommand: pnpm --filter @forge/web start
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: AUTH_SECRET
        sync: false
      - key: AUTH_GOOGLE_ID
        sync: false
      - key: AUTH_GOOGLE_SECRET
        sync: false
      - key: AUTH_GITHUB_ID
        sync: false
      - key: AUTH_GITHUB_SECRET
        sync: false
      - key: AUTH_RESEND_KEY
        sync: false
      - key: NEXT_PUBLIC_API_URL
        sync: false
      - key: APP_BASE_URL
        sync: false
      - key: DATABASE_URL
        sync: false
